name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: sdl-install 
      run: sudo apt update && sudo apt install -y libsdl2-dev
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        submodules: recursive
    - name: build-all
      run: make
    - name: build-tests
      run: make tests
    - name: run-tests
      run: make test
    - name: install-and-use
      # What someone using the library does: install it, build against it with pkg-config
      run: |
        make install PREFIX=$PWD/_install
        PKG_CONFIG_PATH=$PWD/_install/lib/pkgconfig g++ -std=c++17 -Wall -Werror examples/minimal.cpp \
          $(PKG_CONFIG_PATH=$PWD/_install/lib/pkgconfig pkg-config --cflags --libs jgame) -o minimal

  # The same on a Mac (Apple's clang, SDL2 from Homebrew)
  macos:
    runs-on: macos-latest
    steps:
    - name: sdl-install
      run: brew install sdl2
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - name: build-all
      run: make -j$(sysctl -n hw.ncpu)
    - name: build-tests
      run: make tests -j$(sysctl -n hw.ncpu)
    - name: run-tests
      run: make test
