name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: sdl-install 
      run: sudo apt update && sudo apt install -y libsdl2-dev
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        submodules: recursive
    - name: build-all
      run: make
    - name: build-tests
      run: make tests
    - name: run-tests
      run: make test
    - name: install-and-use
      # What someone using the library does: install it, build against it with pkg-config
      run: |
        make install PREFIX=$PWD/_install
        PKG_CONFIG_PATH=$PWD/_install/lib/pkgconfig g++ -std=c++17 -Wall -Werror examples/minimal.cpp \
          $(PKG_CONFIG_PATH=$PWD/_install/lib/pkgconfig pkg-config --cflags --libs jgame) -o minimal
    - name: cmake
      # The CMake build of the same sources, with its tests, and the example through it
      run: |
        cmake -S . -B _cmake -DCMAKE_BUILD_TYPE=Release
        cmake --build _cmake -j$(nproc)
        (cd _cmake && ctest --output-on-failure)
        cmake -S examples -B _cmake-example && cmake --build _cmake-example -j$(nproc)

  # The Android project (android/), building the example into an APK. The runner has the SDK; the NDK
  # and CMake the project asks for are installed by Gradle
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: sdl-sources
      run: android/get-sdl.sh
    - name: apk
      working-directory: android
      run: ./gradlew assembleDebug -Pjgame.game=../examples --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: jgame-minimal-apk
        path: android/app/build/outputs/apk/debug/*.apk

  # The same on a Mac (Apple's clang, SDL2 from Homebrew)
  macos:
    runs-on: macos-latest
    steps:
    - name: sdl-install
      run: brew install sdl2
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - name: build-all
      run: make -j$(sysctl -n hw.ncpu)
    - name: build-tests
      run: make tests -j$(sysctl -n hw.ncpu)
    - name: run-tests
      run: make test
