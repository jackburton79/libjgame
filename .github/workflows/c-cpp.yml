name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: sdl-install 
      run: sudo apt update && sudo apt install -y libsdl2-dev
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        submodules: recursive
    - name: build-all
      run: make
    - name: build-tests
      run: make tests
    - name: run-tests
      run: make test
