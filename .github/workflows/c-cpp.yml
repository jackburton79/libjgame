name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: sdl-install 
      run: sudo apt update && sudo apt install -y libsdl2-dev
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
        submodules: recursive
    - name: build-all
      run: make
    - name: build-tests
      run: make tests
    - name: run-tests
      run: make test

  # The same on a Mac (Apple's clang, SDL2 from Homebrew)
  macos:
    runs-on: macos-latest
    steps:
    - name: sdl-install
      run: brew install sdl2
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - name: build-all
      run: make -j$(sysctl -n hw.ncpu)
    - name: build-tests
      run: make tests -j$(sysctl -n hw.ncpu)
    - name: run-tests
      run: make test
