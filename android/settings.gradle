// The Android project of libjgame: it builds the game whose folder `jgame.game`
// names (see README.md), with SDL's sources and libjgame, into an APK
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'jgame-android'
include ':app'
