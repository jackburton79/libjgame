org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false

# Where the game is (the folder with its CMakeLists.txt and jgame-android.properties),
# from this folder. The default is right when libjgame is a submodule at the top of the
# game's repository. Can be given on the command line: ./gradlew -Pjgame.game=...
jgame.game=../..
# Where SDL2's sources are (get-sdl.sh puts them here)
jgame.sdl=SDL
